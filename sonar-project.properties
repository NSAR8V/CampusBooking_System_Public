# =============================================================================
# SonarCloud Project Configuration
# =============================================================================

# Exclude non-code documentation from code analysis
sonar.exclusions=docs/**

# Exclude legacy experimental baseline (codebase_a) and test suite from duplication checks
# Note: Codebase A is intentionally designed with code smells (including duplication)
# for comparative analysis against the refactored system.
sonar.cpd.exclusions=codebase_a/**,tests/**,docs/**
